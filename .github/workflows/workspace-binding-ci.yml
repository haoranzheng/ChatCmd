name: Workspace binding and write scope checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'web/**'
      - 'docs/workspace-write-authorization.md'
      - '.github/workflows/workspace-binding-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        continue-on-error: true # Existing formatting debt; report failure but run compilation/test checks
      - run: cargo check --workspace --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web
      - run: cargo test --workspace
      - run: cargo build --bin chat-cmd-client
        if: runner.os == 'Windows'
      - run: cargo clippy --workspace --all-targets -- -D warnings
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
        continue-on-error: true # Existing UpdateSettings lint debt; still run tests/build
      - run: npm test -- --run
      - run: npm run build
