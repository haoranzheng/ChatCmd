name: Workspace binding and write scope checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'web/**'
      - 'docs/workspace-write-authorization.md'
      - '.github/workflows/workspace-binding-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        continue-on-error: true # Existing formatting debt; report failure but run compilation/test checks
      - run: cargo check --workspace --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web
      - run: cargo test --workspace
      - run: cargo build --bin chat-cmd-client
        if: runner.os == 'Windows'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build portable Windows x64 preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run build --prefix web
          if ($LASTEXITCODE -ne 0) { throw 'Frontend production build failed' }
          $env:CHATCMD_BUILD_VERSION = "workspace-preview-${{ github.sha }}"
          cargo build --release --features embedded-web --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 release build failed' }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/chat-cmd-client.exe' 'staging/ChatCMD.exe'
          Copy-Item 'chatgpt-extension' 'staging/chatgpt-extension' -Recurse -Force
          Set-Content 'staging/chatcmd-version.txt' -Value $env:CHATCMD_BUILD_VERSION -Encoding ascii
          $hash = (Get-FileHash 'staging/ChatCMD.exe' -Algorithm SHA256).Hash
          Set-Content 'staging/SHA256SUMS.txt' -Value "$hash  ChatCMD.exe" -Encoding ascii
          Compress-Archive -Path 'staging/*' -DestinationPath 'ChatCMD-windows-x64-workspace-preview.zip'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: ChatCMD-windows-x64-workspace-preview
          path: ChatCMD-windows-x64-workspace-preview.zip
          if-no-files-found: error
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
        continue-on-error: true # Existing UpdateSettings lint debt; still run tests/build
      - run: npm test -- --run
      - run: npm run build
